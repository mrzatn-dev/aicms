services:
  - type: web
    name: cms-frontend
    env: docker
    region: oregon
    plan: free
    rootDir: frontend
    dockerfile: ./Dockerfile
    dockerCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://aicms-9kw6.onrender.com
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
    healthCheckPath: /
    autoDeploy: true

  - type: web
    name: cms-api-gateway
    env: docker
    region: oregon
    plan: free
    dockerfile: ./api-gateway/Dockerfile
    envVars:
      - key: DB_HOST
        value: localhost
      - key: DEBUG
        value: "false"
    autoDeploy: true

databases:
  - name: cms-postgres
    databaseName: cms_db
    user: postgres
    region: oregon
    plan: free
