      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: aicms-redis
          property: port
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: aicms-rabbitmq
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        value: cms
      - key: RABBITMQ_PASSWORD
        fromService:
          type: pserv
          name: aicms-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_PASS
      - key: JWT_SECRET_KEY
        fromService:
          type: pserv
          name: auth-service
          envVarKey: JWT_SECRET_KEY
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: ai-service
          property: hostport
      - key: CORS_ORIGINS
        value: https://aicms-frontend.onrender.com,https://aicms-9kw6.onrender.com
      - key: DEBUG
        value: "false"

  - type: pserv
    name: ai-service
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./services/ai-service/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicms-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: aicms-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: aicms-redis
          property: port
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: aicms-rabbitmq
