          name: aicms-redis
          property: port
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: aicms-rabbitmq
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
