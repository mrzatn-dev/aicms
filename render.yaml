    region: oregon
    plan: free
    dockerfilePath: ./api-gateway/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicms-postgres
          property: connectionString
      - key: REDIS_HOST
