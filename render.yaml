services:
  - type: web
    name: cms-frontend
    env: docker
    region: oregon
    plan: free
    rootDir: frontend
    dockerfile: ./Dockerfile
    dockerCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://aicms-9kw6.onrender.com
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: cms-api-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: OAUTH_REDIRECT_URI
        value: https://aicms-9kw6.onrender.com/oauth/callback
    healthCheckPath: /
    autoDeploy: true

  - type: web
    name: cms-api-gateway
    env: docker
    region: oregon
    plan: free
    dockerfile: ./api-gateway/Dockerfile
    envVars:
      - key: DB_HOST
        value: localhost
      - key: DEBUG
        value: "false"
      - key: OAUTH_API_BASE_URL
        value: https://aicms-9kw6.onrender.com
      - key: OAUTH_REDIRECT_URI
        value: https://aicms-9kw6.onrender.com/oauth/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
    autoDeploy: true

databases:
  - name: cms-postgres
    databaseName: cms_db
    user: postgres
    region: oregon
    plan: free
