# Render Blueprint for the full AI CMS environment.
# Public API/OAuth callback:
#   https://aicms-9kw6.onrender.com/api/auth/callback/google
# Frontend:
#   https://aicms-frontend.onrender.com

databases:
  - name: aicms-postgres
    databaseName: cms_db
    user: cms_user
    region: oregon
    plan: free

services:
  - type: keyvalue
    name: aicms-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: pserv
    name: aicms-rabbitmq
    runtime: image
    region: oregon
    plan: starter
    image:
      url: docker.io/library/rabbitmq:3-management-alpine
    disk:
      name: rabbitmq-data
      mountPath: /var/lib/rabbitmq
      sizeGB: 1
    envVars:
      - key: PORT
        value: "5672"
      - key: RABBITMQ_DEFAULT_USER
        value: cms
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  - type: pserv
    name: aicms-minio
    runtime: image
    region: oregon
    plan: starter
    image:
      url: docker.io/minio/minio:latest
    # Render replaces the image CMD; must include the "minio" binary or exit 128.
    dockerCommand: minio server /data --address $HOST:$PORT --console-address $HOST:$CONSOLE_PORT
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "9000"
      - key: CONSOLE_PORT
        value: "9001"
      - key: MINIO_ROOT_USER
        value: minioadmin
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
      - key: MINIO_BROWSER
        value: "off"

  - type: pserv
    name: auth-service
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./services/auth_service/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicms-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: aicms-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: aicms-redis
          property: port
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: aicms-rabbitmq
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        value: cms
      - key: RABBITMQ_PASSWORD
        fromService:
          type: pserv
          name: aicms-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_PASS
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://aicms-frontend.onrender.com,https://aicms-9kw6.onrender.com
      - key: GOOGLE_CLIENT_ID
        value: 651418924165-8m35kvr3dvgbevp7gudmc8ius6i3ve62.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_API_BASE_URL
        value: https://aicms-frontend.onrender.com
      - key: OAUTH_REDIRECT_URI
        value: https://aicms-frontend.onrender.com/oauth/callback
      - key: DEBUG
        value: "false"

  - type: pserv
    name: content-service
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./services/content-service/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicms-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: aicms-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: aicms-redis
          property: port
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: aicms-rabbitmq
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        value: cms
      - key: RABBITMQ_PASSWORD
        fromService:
          type: pserv
          name: aicms-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_PASS
      - key: JWT_SECRET_KEY
        fromService:
          type: pserv
          name: auth-service
          envVarKey: JWT_SECRET_KEY
      - key: CORS_ORIGINS
        value: https://aicms-frontend.onrender.com,https://aicms-9kw6.onrender.com
      - key: MINIO_ENDPOINT
        fromService:
          type: pserv
          name: aicms-minio
          property: hostport
      - key: MINIO_ACCESS_KEY
        value: minioadmin
      - key: MINIO_SECRET_KEY
        fromService:
          type: pserv
          name: aicms-minio
          envVarKey: MINIO_ROOT_PASSWORD
      - key: MINIO_SECURE
        value: "false"
      - key: DEBUG
        value: "false"

  - type: pserv
