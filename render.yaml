      - key: RABBITMQ_PASSWORD
        fromService:
          type: pserv
          name: aicms-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_PASS
      - key: JWT_SECRET_KEY
        fromService:
          type: pserv
          name: auth-service
          envVarKey: JWT_SECRET_KEY
      - key: API_GATEWAY_URL
        fromService:
          type: web
          name: aicms-9kw6
          property: hostport
      - key: AUTH_SERVICE_URL
